<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>Všechny edice · Filipův podivuhodný svět</title>
  <meta name="description" content="Katalog všech edic Filipova podivuhodného světa. Nová edice vychází každé dva měsíce v malé sérii — až dojde, je pryč.">
  <link rel="icon" type="image/png" href="assets/Filip%C5%AFv%20podivuhodn%C3%BD%20sv%C4%9Bt_logo%202.0.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="paper-canvas"
    style="background-color: #F4F2EB; box-sizing: border-box; display: flex; flex-direction: column; font-size: 12px; width: 100%;">
    <div id="global-banner"></div>
    <div id="global-header"></div>

    <div style="box-sizing: border-box; display: flex; flex-direction: column; gap: 48px; padding-bottom: 120px; padding-inline: clamp(20px, 5vw, 80px); padding-top: clamp(40px, 10vw, 100px);">
      <div style="width: 100%; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;">
        <div style="color: #FC7B35; font-family: 'Mulish', system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.22em; line-height: 16px;">
          ✦ VŠECHNY EDICE
        </div>
        <div style="color: #3A2C31; font-family: 'Fraunces', system-ui, sans-serif; font-size: clamp(40px, 8vw, 96px); font-variation-settings: 'wght' 580; font-weight: 580; letter-spacing: -0.032em; line-height: 1.1;">
          Každá edice<br />je jednou.
        </div>
        <div style="max-width: 480px; color: #3A2C31B3; font-family: 'Fraunces', system-ui, sans-serif; font-size: 22px; font-style: italic; line-height: 32px;">
          Nová edice vychází každé dva měsíce. Tisknu je v malé sérii — když série dojde, edice je pryč.
        </div>
      </div>

      <div id="edice-grid"
        style="width: 100%; max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 32px;">
      </div>
    </div>

    <div id="global-footer"></div>
  </div>

  <script src="cms-config.js"></script>
  <script src="components.js"></script>
  <script src="global.js"></script>

  <script>
  (function () {
    var grid = document.getElementById('edice-grid');
    if (!grid || typeof CMS_CONFIG === 'undefined') return;

    var LABELS = {
      available: 'k dispozici',
      last_pieces: 'poslední kusy',
      sold_out: 'doprodáno'
    };

    var MONTHS = ['lednu','únoru','březnu','dubnu','květnu','červnu',
                  'červenci','srpnu','září','říjnu','listopadu','prosinci'];
    function shipMonth(iso) {
      var d = new Date(iso);
      return isNaN(d) ? '' : 'v ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    }

    // Náhled edice: radiální přechod z barvy edice do bílé. Střed se roztáhne
    // přes celý rámeček (proto ellipse + closest-side), takže přechod sedí na
    // jakýkoli poměr stran stejně jako SVG s preserveAspectRatio="none".
    function previewBackground(ed) {
      if (!ed.gradient) return '';
      return ' background-image: radial-gradient(ellipse closest-side at 50% 50%, '
        + ed.gradient + ' 10%, #ffffff 100%);';
    }

    // Planned editions have no price, no form and no order page yet — they
    // exist so visitors can see the rhythm ahead, not to be bought.
    function upcomingCard(ed) {
      return ''
        + '<div class="reveal" style="display: flex; flex-direction: column; gap: 16px; background-color: #FFFFFF4D; border: 1px dashed #3A2C3133; border-radius: 24px; padding: 24px;">'
        + '  <div style="aspect-ratio: 3/2; border-radius: 16px; background-color: #3A2C310D;' + previewBackground(ed) + '"></div>'
        + '  <div style="color: #3A2C3166; font-family: \'Mulish\', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.18em;">EDICE ' + ed.number + '</div>'
        + '  <div style="color: #3A2C31A6; font-family: \'Fraunces\', serif; font-size: 28px; font-variation-settings: \'wght\' 580; line-height: 1.15;">' + ed.name + '</div>'
        + '  <div style="color: #3A2C3199; font-family: \'Mulish\', sans-serif; font-size: 13px; font-weight: 600;">připravuji · odesílám ' + shipMonth(ed.dispatchDate) + '</div>'
        + '</div>';
    }

    function card(ed, isCurrent) {
      var orderable = ed.status !== 'sold_out';
      var accent = orderable ? '#FC7B35' : '#3A2C3166';
      var orderHref = ed.orderPage || 'postovni-klub-objednavka.html';
      return ''
        + '<div class="reveal" style="display: flex; flex-direction: column; gap: 16px; background-color: #FFFFFF80; border: 1px solid #3A2C311F; border-radius: 24px; padding: 24px;">'
        + '  <div style="aspect-ratio: 3/2; border-radius: 16px; background-color: #3A2C310D; background-size: cover; background-position: center;' + previewBackground(ed) + '"'
        + (ed.cover ? ' data-cover="' + ed.cover + '"' : '') + '></div>'
        + '  <div style="display: flex; align-items: baseline; gap: 8px;">'
        + '    <span style="color: ' + accent + '; font-family: \'Mulish\', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.18em;">EDICE ' + ed.number + '</span>'
        + (isCurrent ? '<span style="color: #FF6752; font-family: \'Mulish\', sans-serif; font-size: 11px; font-weight: 700;">· AKTUÁLNÍ</span>' : '')
        + '  </div>'
        + '  <div style="color: #3A2C31; font-family: \'Fraunces\', serif; font-size: 28px; font-variation-settings: \'wght\' 580; line-height: 1.15;">' + ed.name + '</div>'
        + '  <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">'
        + '    <span style="color: #3A2C3199; font-family: \'Mulish\', sans-serif; font-size: 13px; font-weight: 600;">' + (LABELS[ed.status] || ed.status) + '</span>'
        + '    <span style="color: #3A2C31; font-family: \'Fraunces\', serif; font-size: 20px; font-variation-settings: \'wght\' 580;">' + ed.price + ' Kč</span>'
        + '  </div>'
        + (orderable
            ? '  <a class="edition-order-btn" href="' + orderHref + '" style="text-align: center; border-radius: 999px; background-color: #FC7B35; color: #F4F2EB; font-family: \'Mulish\', sans-serif; font-size: 14px; font-weight: 700; padding: 14px 24px; text-decoration: none;">Objednat</a>'
            : '  <div style="text-align: center; border: 1px solid #3A2C3133; border-radius: 999px; color: #3A2C3166; font-family: \'Mulish\', sans-serif; font-size: 14px; font-weight: 700; padding: 14px 24px;">Doprodáno</div>')
        + '</div>';
    }

    // Current edition first, then anything already sold, then what's planned.
    var html = [];
    if (CMS_CONFIG.edition) html.push(card(CMS_CONFIG.edition, true));
    (CMS_CONFIG.archive || []).forEach(function (ed) { html.push(card(ed, false)); });
    (CMS_CONFIG.upcoming || []).forEach(function (ed) { html.push(upcomingCard(ed)); });

    grid.innerHTML = html.join('');

    // Obálku nasadíme přes přechod až ve chvíli, kdy se opravdu načte.
    // Kdybychom ji nasadili rovnou, chybějící soubor by přechod přepsal
    // prázdným místem.
    grid.querySelectorAll('[data-cover]').forEach(function (el) {
      var src = el.getAttribute('data-cover');
      var img = new Image();
      img.onload = function () { el.style.backgroundImage = "url('" + src + "')"; };
      img.src = src;
    });
  })();
  </script>

</body>

</html>
